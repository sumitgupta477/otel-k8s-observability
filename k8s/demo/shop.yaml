# The two demo services plus a load generator.
# All OpenTelemetry settings are environment variables: the app code has no
# endpoints, exporters or sampling rules hard-coded. Shared settings live in
# the otel-env ConfigMap; per-pod values come from the Kubernetes downward API.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-env
data:
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  # Logs go to stdout and are collected from the node by the agent
  # (filelog), the same path as any other container's logs.
  OTEL_LOGS_EXPORTER: none
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_TRACES_SAMPLER: parentbased_always_on
  OTEL_PROPAGATORS: tracecontext,baggage
  # Use the stable HTTP semantic conventions (http.request.method, ...).
  OTEL_SEMCONV_STABILITY_OPT_IN: http
  # Put the trace and span IDs on every log line, so Grafana can link a
  # log line in Loki to its trace in Jaeger.
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOG_LEVEL: info
  OTEL_PYTHON_LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s trace_id=%(otelTraceID)s span_id=%(otelSpanID)s %(message)s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: app
          image: otel-demo-shop:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: otel-env }
          env:
            - { name: SERVICE_ROLE, value: "frontend" }
            - { name: ORDERS_URL, value: "http://orders:8080" }
            - { name: OTEL_SERVICE_NAME, value: frontend }
            # Send telemetry to the collector agent on this pod's own node.
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(NODE_IP):4317" }
            # Identify the pod so the agent's k8sattributes processor can add
            # deployment, node and label metadata reliably.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),deployment.environment.name=demo"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app: orders }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: app
          image: otel-demo-shop:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: otel-env }
          env:
            - { name: SERVICE_ROLE, value: "orders" }
            - { name: ERROR_RATE, value: "0.05" }
            - { name: OTEL_SERVICE_NAME, value: orders }
            # Send telemetry to the collector agent on this pod's own node.
            - name: NODE_IP
              valueFrom: { fieldRef: { fieldPath: status.hostIP } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(NODE_IP):4317" }
            # Identify the pod so the agent's k8sattributes processor can add
            # deployment, node and label metadata reliably.
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_UID
              valueFrom: { fieldRef: { fieldPath: metadata.uid } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.namespace.name=$(POD_NAMESPACE),deployment.environment.name=demo"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orders
spec:
  selector: { app: orders }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Sends a checkout request every second so there is always fresh telemetry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels: { app: loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - while true; do curl -s -o /dev/null http://frontend:8080/checkout; sleep 1; done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
